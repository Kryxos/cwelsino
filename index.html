<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cwelsino &mdash; Punk Rocker Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Special+Elite&family=Rock+Salt&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #0a0a0a;
    --yellow: #f4d03f;
    --magenta: #ff0055;
    --cyan: #00e5ff;
    --cream: #e6e2d3;
    --brick: #2c1e16;
    --mortar: #110b08;
  }
  
  * { box-sizing: border-box; }
  
  html, body { 
    margin: 0; padding: 0; 
    width: 100vw; height: 100vh; 
    overflow: hidden; 
    background-color: var(--mortar); 
  }

  body {
    background-image: 
      linear-gradient(rgba(10, 10, 10, 0.85), rgba(0, 0, 0, 0.95)),
      url('https://images.unsplash.com/photo-1513635269975-59663e0ac1ad?q=80&w=2070&auto=format&fit=crop');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    font-family: 'Special Elite', monospace;
    color: var(--cream);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
  }

  .noise-overlay {
    position: fixed; inset: 0; pointer-events: none; z-index: 1000; opacity: 0.25;
    background: url('data:image/svg+xml;utf8,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noise"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noise)" opacity="1"/%3E%3C/svg%3E');
    mix-blend-mode: multiply;
  }

  .stage {
    position: relative; z-index: 10; width: 100%; height: 100vh; max-width: 1800px;
    display: flex; flex-direction: column; justify-content: space-between; align-items: center;
    padding: 1vh 2vw 2vh;
  }

  .brand { position: relative; margin-top: 1vh; flex-shrink: 0; }
  .brand h1 {
    font-family: 'Permanent Marker', cursive;
    font-size: clamp(28px, 4vh, 50px);
    margin: 0;
    color: var(--cream);
    text-transform: uppercase;
    transform: rotate(-4deg);
    position: relative;
    z-index: 2;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.85), -1px -1px 0 rgba(0,0,0,0.35);
  }
  .brand::before {
    content: ''; position: absolute; inset: -6px -18px;
    background: linear-gradient(90deg, rgba(180,40,80,0.95), rgba(120,30,60,0.92));
    transform: rotate(2deg) skewX(-8deg);
    border: 1px solid rgba(0,0,0,0.65);
    box-shadow: 6px 6px 0 rgba(0,0,0,0.55);
    z-index: 1;
  }
  .brand::after {
    content: 'NO LIMITS!'; position: absolute; bottom: -8px; right: -12px;
    font-family: 'Rock Salt', cursive; font-size: clamp(10px, 1.5vh, 14px); color: rgba(244,208,63,0.95);
    z-index: 3; transform: rotate(-12deg); text-shadow: 1px 1px 0 rgba(0,0,0,0.8);
  }

  .bonus-panel {
    display: flex; flex-direction: column; width: 100%; gap: 0.35vh;
    align-items: center; justify-content: center; text-align: center;
  }
  .fs-banner {
    display: none; width: 100%; text-align: center;
    font-family: 'Permanent Marker', cursive;
    color: #fff;
    background: #111;
    border-left: 4px solid var(--yellow);
    border-right: 4px solid var(--yellow);
    box-shadow: 0 0 20px var(--magenta);
    padding: 0.45vh 0.7vw;
    font-size: clamp(12px, 2vh, 18px);
    letter-spacing: 2px;
    text-shadow: 2px 2px 0 var(--magenta), -1px -1px 0 #000, 1px 1px 0 #000;
    position: relative; z-index: 20;
    margin: 0 auto;
  }
  .fs-banner::before, .fs-banner::after {
    content: ''; position: absolute; left: -4px; right: -4px; height: 6px;
    background: repeating-linear-gradient(-45deg, var(--yellow), var(--yellow) 15px, #000 15px, #000 30px);
    border: 2px solid #000;
  }
  .fs-banner::before { top: -8px; }
  .fs-banner::after { bottom: -8px; }
  .fs-banner.on { display: block; animation: shake 0.5s infinite; }
  .fs-banner.initial {
    animation: popIn 0.5s ease-out 1;
    transform-origin: center;
    font-size: clamp(20px, 4vh, 36px);
    padding: 1vh 1.2vw;
    border-left-width: 6px; border-right-width: 6px;
    box-shadow: 0 8px 30px rgba(255,0,85,0.12), 0 2px 8px rgba(0,0,0,0.6);
    text-shadow: 2px 2px 0 rgba(0,0,0,0.85);
  }
  @keyframes popIn { 0% { transform: scale(0.6) rotate(-4deg); opacity: 0 } 80% { transform: scale(1.05) rotate(-2deg); opacity: 1 } 100% { transform: scale(1) rotate(-2deg); } }

  /* Position FS banner to the left of the brand header */
  #fsBanner {
    position: absolute; z-index: 30; left: 2.2vw; top: 1.6vh;
    transform: rotate(-2deg); max-width: 420px; width: auto;
    box-sizing: border-box;
  }

  /* When banner visible it will use .on and .initial styles */
  .stage { position: relative; }

  @media (max-width: 800px) {
    #fsBanner { left: 1.2vw; top: 3vh; max-width: 260px; font-size: clamp(12px,2.2vh,16px); }
  }
  @keyframes shake { 0% {transform: translate(1px, 1px) rotate(0deg);} 50% {transform: translate(-1px, -1px) rotate(-1deg);} 100% {transform: translate(1px, -1px) rotate(1deg);} }

  .ticker {
    width: 100%;
    background: linear-gradient(180deg,#0b0b0b,#111);
    border: 1px solid rgba(255,255,255,0.04);
    padding: 0.4vh 0.8vw; text-align: center; box-shadow: none;
    display: flex; flex-direction: column; justify-content: center; min-height: clamp(36px, 4vh, 52px);
  }
  .ticker .headline { font-size: clamp(12px, 1.6vh, 14px); font-weight: 700; color: var(--yellow); margin: 0; text-transform: uppercase; font-family: 'Special Elite', monospace; }
  .ticker .headline.zero { color: #bfbfbf; }
  .ticker .lines {
    display: flex; flex-direction: column; gap: 2px; max-height: clamp(26px, 3.2vh, 36px);
    overflow: hidden; font-size: clamp(10px, 1.4vh, 12px); color: #fff; margin-top: 2px;
  }

  .cabinet {
    position: relative; width: 95%; max-width: 1000px;
    flex-grow: 1; flex-shrink: 1; min-height: 0; 
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #000; padding: 6px; border: 3px solid #000; margin: 1.5vh auto;
    box-shadow: 15px 15px 0px rgba(0,0,0,0.8);
  }

  .frame {
    position: relative; height: 100%; width: 100%; padding: 0;
    background: #111; 
    border: none; 
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }

  .grid { 
    display: grid; 
    grid-template-columns: repeat(5, minmax(0, 1fr)); 
    grid-template-rows: repeat(5, minmax(0, 1fr)); 
    gap: 6px; 
    width: 100%; 
    height: 100%; 
    max-height: 100%; 
    background: #000;
  }
  
  .cell {
    display: flex; align-items: center; justify-content: center;
    background: #151515;
    position: relative; overflow: hidden;
    min-width: 0; min-height: 0;
    transition: background-color 0.2s, box-shadow 0.2s;
  }
  
  .cell::after {
    content: ''; position: absolute; inset: 0; z-index: 10; pointer-events: none;
  }

  .slot-icon {
    width: 95%;
    height: 95%;
    object-fit: contain; 
    z-index: 2;
  }
  
  .cell.spinning .slot-icon { animation: reelBlur .06s linear infinite; }
  @keyframes reelBlur { 0%{transform:translateY(-20px) skewY(10deg); filter: blur(0.6px); opacity:.5;} 50%{transform:translateY(0px) skewY(0deg); filter: blur(0.2px); opacity:.6;} 100%{transform:translateY(20px) skewY(-10deg); filter: blur(0.6px); opacity:.5;} }
  
  /* ZRÓWNOWAŻONE, WOLNIEJSZE TEMPO KRĘCENIA PODCZAS NAPIĘCIA */
  .cell.reel-anticipation {
    background: rgba(24, 12, 18, 0.96) !important;
    box-shadow: inset 0 0 0 2px rgba(200, 140, 170, 0.18), inset 0 0 10px rgba(140, 90, 110, 0.12);
  }
  .cell.reel-anticipation::after {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 10;
    pointer-events: none;
    animation: pulseAnticipation 1.0s infinite alternate;
  }
  .cell.reel-anticipation .slot-icon {
    animation: reelAnticipationSpin 0.28s ease-in-out infinite !important;
    transform-origin: center center;
    filter: blur(0.35px);
  }
  @keyframes reelAnticipationSpin {
    0% { transform: translateY(-22px) skewY(6deg); opacity: 0.48; filter: blur(0.5px); }
    35% { transform: translateY(-8px) skewY(3deg); opacity: 0.58; filter: blur(0.36px); }
    50% { transform: translateY(0px) skewY(0deg); opacity: 0.68; filter: blur(0.24px); }
    65% { transform: translateY(8px) skewY(-3deg); opacity: 0.58; filter: blur(0.36px); }
    100% { transform: translateY(22px) skewY(-6deg); opacity: 0.48; filter: blur(0.5px); }
  }
  @keyframes pulseAnticipation {
    0% { box-shadow: inset 0 0 0 2px rgba(190, 120, 150, 0.24), inset 0 0 8px rgba(120, 80, 100, 0.14); }
    100% { box-shadow: inset 0 0 0 3px rgba(170, 100, 130, 0.2), inset 0 0 12px rgba(100, 70, 90, 0.1); }
  }

  .cell.stopped { animation: settle .3s cubic-bezier(.2,1.5,.4,1); }
  @keyframes settle { 0%{transform:translateY(-15px);} 50%{transform:translateY(5px);} 100%{transform:translateY(0);} }
  
  .cell.win::after {
    animation: pulseWin 0.6s infinite alternate;
  }
  /* realisitic win/line animations */
  .cell.win {
    position: relative;
    z-index: 5;
  }
  .cell.win .slot-icon {
    transform-origin: center center;
  }
  .cell.win.win-anim .slot-icon {
    animation: winPop 420ms cubic-bezier(.2,.9,.2,1) forwards;
  }
  @keyframes winPop {
    0% { transform: scale(1) translateY(0) rotate(0deg); filter: brightness(1); }
    40% { transform: scale(1.06) translateY(-5px) rotate(-1.5deg); filter: brightness(1.12) saturate(1.04); }
    100% { transform: scale(1) translateY(0) rotate(0deg); filter: brightness(1); }
  }

  /* shimmer sweep across winning cells to indicate line travel */
  .cell .sweep {
    position: absolute; inset: 0; z-index: 12; pointer-events: none;
    background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,220,120,0.12) 45%, rgba(255,255,255,0) 85%);
    transform: translateX(-120%);
    mix-blend-mode: screen; opacity: 0.95;
  }
  @keyframes sweep {
    0% { transform: translateX(-120%); }
    100% { transform: translateX(120%); }
  }
  @keyframes pulseWin {
    0% { box-shadow: inset 0 0 0 3px rgba(200,170,80,0.65); }
    100% { box-shadow: inset 0 0 0 4px rgba(220,190,110,0.5), inset 0 0 10px rgba(180,150,60,0.18); }
  }
  
  .cell.scatterwin::after {
    animation: pulseScatter 0.9s infinite alternate;
  }
  @keyframes pulseScatter {
    0% { box-shadow: inset 0 0 0 3px rgba(160,70,90,0.45); }
    100% { box-shadow: inset 0 0 0 4px rgba(70,130,140,0.28), inset 0 0 10px rgba(70,130,140,0.12); }
  }

  .wild-mult-badge {
    position: absolute; bottom: 2px; right: 2px; z-index: 15;
    background: rgba(28,28,28,0.92); color: #fff; border: 1px solid rgba(0,0,0,0.6);
    font-family: 'Permanent Marker', cursive; font-size: clamp(10px, 1.6vh, 14px);
    padding: 0 4px; line-height: 1.4; box-shadow: 1px 1px 0 rgba(0,0,0,0.85);
    transform: rotate(-3deg); pointer-events: none;
  }

  .cell.sticky-wild::after {
    box-shadow: inset 0 0 0 3px rgba(70,130,140,0.36), inset 0 0 18px rgba(70,130,140,0.12);
    animation: pulseSticky 1s infinite alternate;
  }
  @keyframes pulseSticky {
    0% { box-shadow: inset 0 0 0 3px rgba(70,130,140,0.28), inset 0 0 12px rgba(70,130,140,0.10); }
    100% { box-shadow: inset 0 0 0 4px rgba(160,80,100,0.18), inset 0 0 20px rgba(160,80,100,0.06); }
  }

  .bottom-dock {
    width: 100%; max-width: 1400px; background: linear-gradient(180deg, #0c0c0c 0%, #151515 100%);
    border: 1px solid rgba(255,255,255,0.03);
    padding: 0.9vh 2vw; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.02); position: relative;
    z-index: 100; flex-shrink: 0; border-radius: 10px;
    height: clamp(56px, 9vh, 84px);
  }
  .bottom-dock::before { display: none; }

  .dock-left { display: flex; align-items: center; gap: 8px; }

  .ante-pill-btn {
    background: linear-gradient(180deg,#121214,#0d0d0e); padding: 0.45vh 0.8vw; display: flex; align-items: center; gap: 6px; cursor: pointer;
    border: 1px solid rgba(255,255,255,0.03); box-shadow: 0 6px 10px rgba(0,0,0,0.5); transition: all 0.12s; border-radius:6px;
  }
  .ante-pill-btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 transparent; }
  .ante-pill-btn .ante-txt { font-family: 'Special Elite', monospace; font-size: clamp(8px, 1.1vh, 10px); font-weight: 700; color: #fff; text-transform: uppercase; line-height: 1.2; }

  .buy-bonus-btn {
    background: linear-gradient(180deg, #f1d76a 0%, #cf9f32 100%); border: 1px solid rgba(0,0,0,0.45); padding: 0.45vh 0.8vw; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer;
    box-shadow: 0 6px 12px rgba(0,0,0,0.45); transition: all 0.12s; border-radius: 6px;
  }
  .buy-bonus-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 18px rgba(0,0,0,0.5); }
  .buy-bonus-btn:active { transform: translateY(0); box-shadow: 0 6px 12px rgba(0,0,0,0.45); }
  .buy-bonus-btn:disabled { filter: grayscale(1); opacity: 0.5; pointer-events: none; }
  .buy-bonus-title { font-family: 'Permanent Marker', cursive; font-size: clamp(11px, 1.5vh, 14px); color: #000; }
  .buy-bonus-price { font-family: 'Special Elite', monospace; font-size: clamp(9px, 1.3vh, 11px); font-weight: 700; color: #000; }

  .buy-super-btn {
    background: linear-gradient(180deg, #da7fa8 0%, #b24a92 100%); border: 1px solid rgba(0,0,0,0.45); padding: 0.45vh 0.8vw; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer;
    box-shadow: 0 6px 12px rgba(0,0,0,0.45); transition: all 0.12s; border-radius: 6px;
  }
  .buy-super-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 18px rgba(0,0,0,0.5); }
  .buy-super-btn:active { transform: translateY(0); box-shadow: 0 6px 12px rgba(0,0,0,0.45); }
  .buy-super-btn:disabled { filter: grayscale(1); opacity: 0.5; pointer-events: none; }
  .buy-super-btn .buy-bonus-title { font-family: 'Permanent Marker', cursive; font-size: clamp(11px, 1.5vh, 14px); color: #fff; }
  .buy-super-btn .buy-bonus-price { font-family: 'Special Elite', monospace; font-size: clamp(9px, 1.3vh, 11px); font-weight: 700; color: var(--yellow); }

  .sound-control-box {
    display: flex; align-items: center; gap: 8px;
    background: linear-gradient(180deg,#0f0f10,#141414); border: 1px solid rgba(255,255,255,0.03);
    padding: 0 10px; height: clamp(36px, 5vh, 46px);
    box-shadow: 0 6px 12px rgba(0,0,0,0.45); border-radius: 6px;
  }
  .sound-control-box button {
    background: none; border: none; color: #fff; 
    font-size: clamp(14px, 2.2vh, 18px); cursor: pointer; padding: 0; outline: none;
  }
  .volume-slider {
    -webkit-appearance: none; width: clamp(40px, 5vw, 70px); height: 6px; 
    background: #222; border: 1px solid #000; outline: none; cursor: pointer;
  }
  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: clamp(12px, 2vh, 16px); height: clamp(12px, 2vh, 16px);
    background: var(--cyan); border: 2px solid #000; cursor: pointer;
  }

  .icon-btn { background: #000; border: 2px solid #555; color: #fff; width: clamp(35px, 5vh, 44px); height: clamp(35px, 5vh, 44px); cursor: pointer; font-size: clamp(16px, 2.5vh, 20px); box-shadow: 3px 3px 0 #555; }
  .icon-btn { background: linear-gradient(180deg,#232226,#151517); border: 1px solid rgba(255,255,255,0.03); color: #fff; width: clamp(35px, 5vh, 44px); height: clamp(35px, 5vh, 44px); cursor: pointer; font-size: clamp(16px, 2.5vh, 20px); box-shadow: 0 6px 10px rgba(0,0,0,0.45); border-radius:6px; }
  .icon-btn:active { transform: translateY(2px); box-shadow: 0 4px 8px rgba(0,0,0,0.4); }

  .dock-center { display: flex; align-items: center; gap: clamp(10px, 2vw, 30px); }
  .info-block { display: flex; flex-direction: column; text-align: center; }
  .info-block .lbl { font-family: 'Permanent Marker', cursive; font-size: clamp(10px, 1.5vh, 12px); color: var(--magenta); text-transform: uppercase; letter-spacing: 1px; }
  .info-block .val { font-family: 'Special Elite', monospace; font-size: clamp(16px, 2.5vh, 22px); font-weight: 700; color: #fff; background: linear-gradient(180deg,#0b0b0b,#121212); padding: 4px 12px; border: 1px solid rgba(255,255,255,0.04); box-shadow: inset 0 1px 0 rgba(255,255,255,0.02); border-radius: 6px; }

  .bet-control-box { display: flex; align-items: center; background: #111; border: 2px solid #333; padding: 2px 10px; gap: 10px; }
  .bet-arrows { display: flex; flex-direction: column; gap: 0; }
  .arrow-btn { background: none; border: none; color: var(--yellow); font-size: clamp(10px, 1.5vh, 14px); cursor: pointer; line-height: 1; padding: 2px; }
  .arrow-btn:hover { color: #fff; }
  .arrow-btn:disabled { opacity: 0.2; }

  .dock-right { display: flex; align-items: center; }

  .main-spin-btn {
    width: clamp(56px, 9vh, 80px); height: clamp(56px, 9vh, 80px); border: none;
    background: linear-gradient(90deg, rgba(180,40,80,0.98) 0%, rgba(120,30,60,0.95) 100%);
    color: var(--cream); font-size: clamp(20px, 3vh, 30px); cursor: pointer;
    box-shadow: 0 8px 18px rgba(0,0,0,0.6); border-radius: 50%; font-family: 'Permanent Marker', cursive; padding-bottom: 5px; border: 1px solid rgba(0,0,0,0.5);
  }
  .main-spin-btn:active { transform: translateY(2px); box-shadow: 0 6px 12px rgba(0,0,0,0.45); }

  .bigwin-overlay {
    position: fixed; inset: 0; z-index: 2000; background: rgba(0, 0, 0, 0.9);
    display: none; flex-direction: column; align-items: center; justify-content: center; user-select: none;
  }
  .bigwin-overlay.open { display: flex; }

  .bigwin-rays {
    position: absolute; width: 150vw; height: 150vw;
    background: repeating-conic-gradient( rgba(0,0,0,0.6) 0deg 12deg, rgba(180,80,120,0.06) 12deg 24deg );
    opacity: 0.22; animation: rotateRays 14s linear infinite; mix-blend-mode: soft-light; pointer-events: none;
  }
  @keyframes rotateRays { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

  .bigwin-card { position: relative; z-index: 2; text-align: center; display: flex; flex-direction: column; align-items: center; }
  .bigwin-title {
    font-family: 'Permanent Marker', cursive; font-size: clamp(40px, 8vw, 120px); margin: 0; color: var(--yellow);
    text-transform: uppercase; transform: rotate(-5deg); text-shadow: 4px 4px 0px rgba(0,0,0,0.85), 8px 8px 0px rgba(0,0,0,0.25);
    animation: punkBounce 0.2s infinite alternate steps(2, end);
  }
  @keyframes punkBounce { 0% { transform: scale(0.95) rotate(-5deg) translate(-2px, -2px); } 100% { transform: scale(1.05) rotate(-3deg) translate(2px, 2px); } }

  .bigwin-counter {
    font-family: 'Rock Salt', cursive; font-size: clamp(30px, 6vw, 80px); font-weight: bold; color: #fff;
    background: linear-gradient(180deg,#070707,#0e0e0e); padding: 12px 34px; border-radius:10px; transform: rotate(2deg); margin-top: 20px;
    border: 2px solid rgba(255,255,255,0.04); box-shadow: 0 20px 40px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.02);
  }
  .bigwin-hint { font-family: 'Special Elite', monospace; font-size: 16px; color: #aaa; margin-top: 30px; background: #000; padding: 5px; }

  .paytable {
    display: none; position: fixed; bottom: 12vh; left: 50%; transform: translateX(-50%) rotate(-1deg); max-width: 600px; width: 90%;
    background: var(--cream); border: 5px solid #000; padding: 20px; font-family: 'Special Elite', monospace; z-index: 100;
    box-shadow: 15px 15px 0 rgba(0,0,0,0.9); color: #000;
    max-height: 70vh; overflow-y: auto;
  }
  .paytable.open { display: block; }
  .paytable h3 { margin: 0 0 15px; font-family: 'Permanent Marker', cursive; font-size: 22px; border-bottom: 4px solid #000; padding-bottom: 5px; }
  .pt-row { display: flex; align-items: center; gap: 15px; padding: 8px 0; border-bottom: 2px dashed #666; font-size: 14px; font-weight: bold; }
  .pt-sym { width: 40px; height: 40px; flex-shrink: 0; }
  .pt-sym img { width: 100%; height: 100%; object-fit: contain; }

  .overlay-bankrupt {
    position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; align-items: center; justify-content: center; z-index: 1500;
  }
  .overlay-bankrupt.open { display: flex; }
  .ob-card { background: var(--magenta); border: 6px solid #000; padding: 40px; text-align: center; box-shadow: 15px 15px 0 var(--yellow); transform: rotate(-2deg); }

</style>

<script>
(function(){
  "use strict";

  const imageTags = {
    monkey:    `<img src="monkey.png" alt="Monkey" class="slot-icon">`,
    punkBlue:  `<img src="punk_blue.png" alt="Punk Blue" class="slot-icon">`,
    punkPink:  `<img src="punk_pink.png" alt="Punk Pink" class="slot-icon">`,
    hatGuy:    `<img src="hat_guy.png" alt="Hat Guy" class="slot-icon">`,
    punkGreen: `<img src="punk_green.png" alt="Punk Green" class="slot-icon">`,
    anarchy:   `<img src="anarchy.png" alt="Anarchy" class="slot-icon">`,
    knuckles:  `<img src="knuckles.png" alt="Knuckles" class="slot-icon">`,
    wild:      `<img src="wild.png" alt="WILD" class="slot-icon">`,
    scatter:   `<img src="scatter.png" alt="SCATTER" class="slot-icon">`
  };

  let soundEnabled = true;
  let currentVolume = 0.5;
  const EFFECTS_VOLUME_MULT = 1.5;
  const MUSIC_VOLUME_MULT = 0.35;
  let skipSpinRequested = false;
  let bonusMusicActive = false;
  let activeBonusAudio = null;

  const bgAudio = document.getElementById('bgMusic');
  const bonusAudio = document.getElementById('bonusMusic');
  const superAudio = document.getElementById('superMusic');

  let audioCtx = null;
  let audioUnlocked = false;

  async function initAudioCtx() {
    if (!audioCtx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();
    }
    if (audioCtx.state === 'suspended') {
      try {
        await audioCtx.resume();
        audioUnlocked = true;
      } catch (e) {
        console.warn('AudioContext resume failed:', e);
      }
    } else {
      audioUnlocked = true;
    }
    return audioCtx;
  }

  function unlockAudio() {
    if (audioUnlocked) return;
    if (!audioCtx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume().catch(() => {});
    }
    audioUnlocked = true;
    if (soundEnabled && currentVolume > 0) {
      handleBgMusic();
    }
  }

  document.addEventListener('click', unlockAudio, { once: true, passive: true });
  document.addEventListener('keydown', unlockAudio, { once: true, passive: true });

  async function playTone(freq, duration, type = 'sine', gainVal = 0.2, attack = 0.01, decay = 0.1, delayStart = 0, filterType = 'lowpass', filterFreq = 1800) {
    if (!soundEnabled || currentVolume === 0) return;
    await initAudioCtx();

    const now = audioCtx.currentTime + delayStart;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();

    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);

    filter.type = filterType;
    filter.frequency.setValueAtTime(filterFreq, now);

    gain.gain.setValueAtTime(0.001, now);
    gain.gain.linearRampToValueAtTime(gainVal * currentVolume * EFFECTS_VOLUME_MULT, now + attack);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + attack + decay + duration);

    osc.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start(now);
    osc.stop(now + attack + decay + duration + 0.05);
  }

  async function playNoise(duration, gainVal = 0.1, delayStart = 0) {
    if (!soundEnabled || currentVolume === 0) return;
    await initAudioCtx();

    const bufferSize = Math.max(1, Math.floor(audioCtx.sampleRate * duration));
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
    }

    const source = audioCtx.createBufferSource();
    source.buffer = buffer;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(gainVal * currentVolume * EFFECTS_VOLUME_MULT, audioCtx.currentTime + delayStart);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + delayStart + duration);

    source.connect(gain);
    gain.connect(audioCtx.destination);
    source.start(audioCtx.currentTime + delayStart);
    source.stop(audioCtx.currentTime + delayStart + duration + 0.05);
  }

  async function playAnticipationSound(step) {
    if (!soundEnabled || currentVolume === 0) return;
    await initAudioCtx();
    const now = audioCtx.currentTime;

    // Layered gritty riser: detuned saw + sub square + noise
    const lead = audioCtx.createOscillator();
    const sub = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();

    lead.type = 'sawtooth';
    lead.frequency.setValueAtTime(320 + step * 60, now);
    lead.detune.setValueAtTime(-10, now);

    sub.type = 'square';
    sub.frequency.setValueAtTime(110 + step * 20, now);
    sub.detune.setValueAtTime(5, now);

    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(600 + step * 120, now);
    filter.Q.setValueAtTime(4, now);

    gain.gain.setValueAtTime(0.001, now);
    gain.gain.linearRampToValueAtTime(0.22 * currentVolume * EFFECTS_VOLUME_MULT, now + 0.28);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.9);

    lead.connect(filter);
    sub.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);

    lead.start(now);
    sub.start(now);
    // upward pitch sweep
    lead.frequency.exponentialRampToValueAtTime(750 + step * 150, now + 0.85);
    sub.frequency.exponentialRampToValueAtTime(220 + step * 40, now + 0.85);

    // Add short noise bed under anticipation
    playNoise(0.45, 0.08, 0);

    // stop oscillators shortly after
    lead.stop(now + 0.9);
    sub.stop(now + 0.9);
  }

  function playSound(type) {
    if (!soundEnabled || currentVolume === 0) return;

    if (type === 'spin') {
      // gritty dual saw buzz + noise
      playTone(150, 0.12, 'sawtooth', 0.26, 0.004, 0.09, 0, 'lowpass', 1400);
      playTone(190, 0.12, 'square', 0.14, 0.004, 0.09, 0.01, 'lowpass', 1200);
      playNoise(0.12, 0.12, 0.02);

    } else if (type === 'stop') {
      // punchy saw + metallic snap
      playTone(260.00, 0.06, 'sawtooth', 0.3, 0.002, 0.06, 0, 'highpass', 800);
      playTone(520.00, 0.035, 'square', 0.14, 0.001, 0.03, 0.02, 'highpass', 1200);

    } else if (type === 'win') {
      // ascending gritty riff
      const notes = [196.00, 246.94, 329.63, 392.00];
      notes.forEach((f, idx) => {
        playTone(f, 0.38, 'sawtooth', 0.22, 0.01, 0.3, idx * 0.06, 'lowpass', 1600 - idx * 100);
      });
      playNoise(0.36, 0.08, 0.02);

    } else if (type === 'bonus') {
      // short arpeggio + noise
      const notes = [220.00, 277.18, 329.63];
      notes.forEach((f, idx) => {
        playTone(f, 0.18, 'triangle', 0.2, 0.005, 0.12, idx * 0.05, 'bandpass', 900 + idx * 120);
      });
      playNoise(0.22, 0.07, 0.04);

    } else if (type === 'coin') {
      playTone(523.25, 0.28, 'sawtooth', 0.22, 0.005, 0.18, 0, 'lowpass', 1400);
      playTone(880.00, 0.18, 'square', 0.14, 0.003, 0.15, 0.03, 'highpass', 2200);
      playNoise(0.28, 0.09, 0.01);
    } else if (type === 'reelStop') {
      // quieter, short reel stop thud
      playTone(320.00, 0.06, 'triangle', 0.12, 0.002, 0.05, 0, 'highpass', 900);
      playTone(640.00, 0.04, 'square', 0.08, 0.001, 0.04, 0.01, 'highpass', 1400);
      playNoise(0.06, 0.05, 0);
    }
  }

  function updateVolumes() {
    const targetVol = soundEnabled ? currentVolume * MUSIC_VOLUME_MULT : 0;
    if (bgAudio) bgAudio.volume = targetVol;
    if (bonusAudio) bonusAudio.volume = targetVol;
    if (superAudio) superAudio.volume = targetVol;
  }

  function playBonusMusic(isSuper) {
    bonusMusicActive = true;
    activeBonusAudio = isSuper ? superAudio : bonusAudio;
    try {
      if (bgAudio && !bgAudio.paused) bgAudio.pause();
      if (isSuper) {
        if (bonusAudio && !bonusAudio.paused) bonusAudio.pause();
        if (superAudio && soundEnabled && currentVolume > 0) {
          superAudio.currentTime = 0;
          superAudio.play().catch(()=>{});
        }
      } else {
        if (superAudio && !superAudio.paused) superAudio.pause();
        if (bonusAudio && soundEnabled && currentVolume > 0) {
          bonusAudio.currentTime = 0;
          bonusAudio.play().catch(()=>{});
        }
      }
    } catch(e) { console.warn('playBonusMusic error', e); }
  }

  function stopBonusMusic() {
    bonusMusicActive = false;
    activeBonusAudio = null;
    try {
      if (bonusAudio && !bonusAudio.paused) bonusAudio.pause();
      if (superAudio && !superAudio.paused) superAudio.pause();
      if (soundEnabled && currentVolume > 0 && bgAudio) {
        bgAudio.currentTime = 0;
        bgAudio.play().catch(()=>{});
      }
    } catch(e) { console.warn('stopBonusMusic error', e); }
  }

  function handleBgMusic() {
    if (bonusMusicActive) {
      if (!soundEnabled || currentVolume === 0) {
        if (bgAudio && !bgAudio.paused) bgAudio.pause();
        if (activeBonusAudio && !activeBonusAudio.paused) activeBonusAudio.pause();
      }
      return;
    }

    if (soundEnabled && currentVolume > 0 && bgAudio.paused) {
      bgAudio.play().catch(e => console.log("Muzyka zablokowana przez przeglądarkę."));
    } else if (!soundEnabled || currentVolume === 0) {
      bgAudio.pause();
    }
  }

  const volumeSlider = document.getElementById('volumeSlider');
  const soundToggle = document.getElementById('soundToggle');

  volumeSlider.addEventListener('input', (e) => {
    currentVolume = parseFloat(e.target.value);
    updateVolumes();
    if (currentVolume === 0) {
      soundEnabled = false;
      soundToggle.textContent = '🔇';
      if (bgAudio) bgAudio.pause();
      if (bonusAudio) bonusAudio.pause();
      if (superAudio) superAudio.pause();
    } else {
      soundEnabled = true;
      soundToggle.textContent = '🔊';
      if (!bonusMusicActive) {
        handleBgMusic();
      }
    }
  });

  soundToggle.addEventListener('click', () => { 
    soundEnabled = !soundEnabled; 
    if (soundEnabled) {
      soundToggle.textContent = '🔊';
      if (currentVolume === 0) { currentVolume = 0.5; volumeSlider.value = 0.5; }
      updateVolumes();
      if (!bonusMusicActive) {
        handleBgMusic();
      }
    } else {
      soundToggle.textContent = '🔇';
      updateVolumes();
      if (bgAudio) bgAudio.pause();
      if (bonusAudio) bonusAudio.pause();
      if (superAudio) superAudio.pause();
    }
  });

  const SYMBOLS = {
    "monkey":    { weight: 4.0,  payout: {3: 3.2,   4: 18.0,  5: 320.0}, tier: "win" },
    "punkBlue":  { weight: 6.2,  payout: {3: 1.8,   4: 10.0,  5: 100.0}, tier: "win" },
    "punkPink":  { weight: 9.0,  payout: {3: 1.0,   4: 4.5,   5: 45.0},  tier: "win" },
    "hatGuy":    { weight: 12.0, payout: {3: 0.55,  4: 2.3,   5: 24.0},  tier: "win" },
    "punkGreen": { weight: 14.5, payout: {3: 0.42,  4: 1.5,   5: 13.0},  tier: "win" },
    "anarchy":   { weight: 17.5, payout: {3: 0.27,  4: 0.75,  5: 4.2},   tier: "win" },
    "knuckles":  { weight: 15.5, payout: {3: 0.18,  4: 0.45,  5: 3.2},   tier: "win" },
    "wild":      { weight: 2.5,  payout: {3: 3.2,   4: 18.0,  5: 320.0}, tier: "wild" },
    "scatter":   { weight: 1.9,  payout: {3: 1.7,   4: 4.2,   5: 9.0},   tier: "scatter" }
  };

  const WILD_MULT_VALUES  = [2, 3, 4, 5];
  const WILD_MULT_WEIGHTS = [0.45, 0.30, 0.18, 0.07];
  function rollWildMultiplier() {
    const total = WILD_MULT_WEIGHTS.reduce((a,b)=>a+b,0);
    let r = Math.random() * total;
    for (let i=0;i<WILD_MULT_VALUES.length;i++){
      r -= WILD_MULT_WEIGHTS[i];
      if (r <= 0) return WILD_MULT_VALUES[i];
    }
    return WILD_MULT_VALUES[WILD_MULT_VALUES.length-1];
  }

  const SYMBOL_LIST = Object.keys(SYMBOLS);
  const WILD = "wild";
  const SCATTER = "scatter";

  const PAYLINES = [
    [[0,0],[0,1],[0,2],[0,3],[0,4]], [[1,0],[1,1],[1,2],[1,3],[1,4]], [[2,0],[2,1],[2,2],[2,3],[2,4]], [[3,0],[3,1],[3,2],[3,3],[3,4]], [[4,0],[4,1],[4,2],[4,3],[4,4]],
    [[0,0],[1,1],[0,2],[1,3],[0,4]], [[1,0],[2,1],[1,2],[2,3],[1,4]], [[2,0],[3,1],[2,2],[3,3],[2,4]], [[3,0],[4,1],[3,2],[4,3],[3,4]],
    [[1,0],[0,1],[1,2],[0,3],[1,4]], [[2,0],[1,1],[2,2],[1,3],[2,4]], [[3,0],[2,1],[3,2],[2,3],[3,4]], [[4,0],[3,1],[4,2],[3,3],[4,4]],
    [[0,0],[1,1],[2,2],[3,3],[4,4]], [[2,0],[3,1],[4,2],[3,3],[2,4]], [[2,0],[1,1],[0,2],[1,3],[2,4]], [[4,0],[3,1],[2,2],[1,3],[0,4]],
    [[3,0],[2,1],[1,2],[2,3],[3,4]], [[1,0],[2,1],[3,2],[2,3],[1,4]]
  ];

  const BET_PRESETS = [0.5, 0.8, 1, 2, 5, 8, 10, 25, 30, 50, 75, 100];
  let state = { balance: 1000, baseBet: 10, anteActive: false, busy: false };

  function getActualCost() { return state.anteActive ? state.baseBet * 2.0 : state.baseBet; }
  function getBuyBonusCost() { return state.baseBet * 25; }
  function getBuySuperBonusCost() { return state.baseBet * 107; }

  function weightedSymbol(allowScatter = true, isSuperFS = false) {
    const currentWeights = SYMBOL_LIST.map(s => {
      if (s === SCATTER) {
        if (!allowScatter) return 0;
        if (state.anteActive) return 4.0; 
        return SYMBOLS[s].weight;
      }
      if (s === WILD && isSuperFS) return 1.1;
      return SYMBOLS[s].weight;
    });
    const totalWeight = currentWeights.reduce((a,b)=>a+b,0);
    let r = Math.random() * totalWeight;
    for (let i=0;i<SYMBOL_LIST.length;i++){
      r -= currentWeights[i];
      if (r <= 0) return SYMBOL_LIST[i];
    }
    return SYMBOL_LIST[SYMBOL_LIST.length-1];
  }

  function spinReels(isSuperFS = false) {
    const g = Array.from({length: 5}, () => Array(5).fill(null));
    for (let col = 0; col < 5; col++) {
      let scatterPlacedInCol = false;
      for (let row = 0; row < 5; row++) {
        const sym = weightedSymbol(!scatterPlacedInCol, isSuperFS);
        if (sym === SCATTER) scatterPlacedInCol = true;
        g[row][col] = sym;
      }
    }
    return g;
  }

  function randomSpinSymbol() {
    return SYMBOL_LIST[Math.floor(Math.random() * SYMBOL_LIST.length)];
  }

  function spinReelsForBuyBonus() {
    const g = spinReels();
    for (let r=0;r<5;r++) for (let c=0;c<5;c++) if(g[r][c] === SCATTER) g[r][c] = SYMBOL_LIST[6];
    const rand = Math.random();
    let numScatters = rand > 0.97 ? 5 : (rand > 0.85 ? 4 : 3);
    const availableCols = [0, 1, 2, 3, 4];
    for(let i=0; i<numScatters; i++){
      const colIdx = Math.floor(Math.random() * availableCols.length);
      const col = availableCols.splice(colIdx, 1)[0];
      const row = Math.floor(Math.random() * 5);
      g[row][col] = SCATTER;
    }
    return g;
  }

  function spinReelsForBuySuperBonus() {
    const g = spinReels();
    for (let r=0;r<5;r++) for (let c=0;c<5;c++) if(g[r][c] === SCATTER) g[r][c] = SYMBOL_LIST[6];
    for (let col = 0; col < 5; col++) {
      const row = Math.floor(Math.random() * 5);
      g[row][col] = SCATTER;
    }
    return g;
  }

  function fmt(n) { return n.toLocaleString('pl-PL', {minimumFractionDigits:2, maximumFractionDigits:2}); }

  function evaluateSpin(grid, baseBet, isBonus = false, multGrid = null) {
    let totalWin = 0; const details = []; const winCells = new Set(); const scatterCells = [];
    let scatterCount = 0;
    for (let r=0;r<5;r++) for (let c=0;c<5;c++) if (grid[r][c] === SCATTER) { scatterCount++; scatterCells.push(r+","+c); }

    let freeSpinsWon = 0;
    if (scatterCount >= 3){
      const key = Math.min(scatterCount,5);
      if (!isBonus) {
        const scatterWin = baseBet * (SYMBOLS[SCATTER].payout[key] || 9.0);
        totalWin += scatterWin; 
        // First-time bonus award should always grant 10 free spins
        freeSpinsWon = 10;
        details.push({ text: "BONUS SCATTER x" + scatterCount + ": +" + fmt(scatterWin) + " + 10 FS", amount: scatterWin });
      } else {
        // During an active free-spins (bonus or super), retriggers should grant:
        // 3 scatters -> +2 spins, 4 scatters -> +3 spins, 5 scatters -> +5 spins
        freeSpinsWon = scatterCount === 3 ? 2 : (scatterCount === 4 ? 3 : 5);
        details.push({ text: "RETRIGGER x" + scatterCount + ": +" + freeSpinsWon + " FS!", amount: 0 });
      }
      scatterCells.forEach(k => winCells.add(k));
    }

    // Collect winning lines first, then merge intersecting lines into components
    const winningLines = [];
    PAYLINES.forEach((line, lIdx) => {
      let firstSym = null;
      let matchLength = 0;
      const lineCells = [];

      for (let i = 0; i < 5; i++) {
        const [r, c] = line[i];
        const sym = grid[r][c];
        if (sym === SCATTER) break;

        if (firstSym === null) {
          if (sym !== WILD) firstSym = sym;
          matchLength++;
          lineCells.push(r + "," + c);
        } else {
          if (sym === firstSym || sym === WILD) {
            matchLength++;
            lineCells.push(r + "," + c);
          } else break;
        }
      }

      if (firstSym === null && matchLength > 0) firstSym = WILD;

      if (matchLength >= 3 && firstSym && SYMBOLS[firstSym]) {
        const baseMult = SYMBOLS[firstSym].payout[matchLength] || 0;
        if (baseMult > 0) {
          const baseWin = baseBet * baseMult;
          // count wild multipliers that are physically on this line (for later grouping)
          let lineWildSum = 0;
          let wildCountInLine = 0;
          if (multGrid) {
            lineCells.forEach(key => {
              if (multGrid.has(key)) {
                lineWildSum += multGrid.get(key);
                wildCountInLine++;
              }
            });
          }

          winningLines.push({ lIdx, firstSym, matchLength, lineCells, baseMult, baseWin, lineWildSum, wildCountInLine });
        }
      }
    });

    // If no winning lines, skip
    if (winningLines.length > 0) {
      // Build adjacency between lines if they share any cell
      const n = winningLines.length;
      const adj = Array.from({ length: n }, () => []);
      for (let i = 0; i < n; i++) {
        for (let j = i + 1; j < n; j++) {
          const setA = new Set(winningLines[i].lineCells);
          const setB = new Set(winningLines[j].lineCells);
          let intersect = false;
          for (const c of setA) { if (setB.has(c)) { intersect = true; break; } }
          if (intersect) { adj[i].push(j); adj[j].push(i); }
        }
      }

      // find components of connected lines
      const seen = new Array(n).fill(false);
      for (let i = 0; i < n; i++) {
        if (seen[i]) continue;
        const stack = [i];
        const compIdxs = [];
        seen[i] = true;
        while (stack.length) {
          const u = stack.pop();
          compIdxs.push(u);
          for (const v of adj[u]) if (!seen[v]) { seen[v] = true; stack.push(v); }
        }

        // combine base wins and collect union of cells for this component
        let combinedBase = 0;
        const compCells = new Set();
        compIdxs.forEach(id => {
          combinedBase += winningLines[id].baseWin;
          winningLines[id].lineCells.forEach(c => compCells.add(c));
        });

        // sum wild multipliers anywhere inside component's cells (including wilds not on specific line)
        let combinedWildSum = 0;
        if (multGrid) {
          compCells.forEach(key => { if (multGrid.has(key)) combinedWildSum += multGrid.get(key); });
        }

        const combinedMultiplier = combinedWildSum > 0 ? combinedWildSum : 1;
        const combinedWin = combinedBase * combinedMultiplier;

        // allocate wins back to lines proportionally to their baseWin
        compIdxs.forEach(id => {
          const ln = winningLines[id];
          const share = ln.baseWin / combinedBase;
          const lineWin = combinedWin * share;
          totalWin += lineWin;
          ln.lineCells.forEach(k => winCells.add(k));
          const wildTag = combinedMultiplier > 1 ? ` [WILD x${combinedMultiplier}]` : '';
          details.push({ text: `Linia #${ln.lIdx+1} (${ln.firstSym} x${ln.matchLength}${wildTag}): +${fmt(lineWin)}`, amount: lineWin });
        });
      }
    }

    return { totalWin, details, winCells, scatterCells, scatterCount, freeSpinsWon };
  }

  function simulateBaseSpin(baseBet = 1.0, ante = false) {
    const grid = spinReels(false, ante);
    const res = evaluateSpin(grid, baseBet, false, null);
    let totalWin = res.totalWin;
    let fsLeft = res.freeSpinsWon;

    while (fsLeft > 0) {
      fsLeft -= 1;
      const fsGrid = spinReels(false, ante);
      const multGrid = new Map();
      for (let r = 0; r < 5; r++) {
        for (let c = 0; c < 5; c++) {
          if (fsGrid[r][c] === WILD) {
            multGrid.set(r + ',' + c, rollWildMultiplier());
          }
        }
      }
      const fsRes = evaluateSpin(fsGrid, baseBet, true, multGrid);
      totalWin += fsRes.totalWin;
      if (fsRes.freeSpinsWon > 0) fsLeft += fsRes.freeSpinsWon;
    }

    return totalWin;
  }

  function estimateRTP(spins = 100000, ante = false) {
    let totalReturn = 0;
    for (let i = 0; i < spins; i++) {
      totalReturn += simulateBaseSpin(1.0, ante);
    }
    const rtp = totalReturn / spins;
    console.log(`Estimated RTP (${spins.toLocaleString()} spins, ante=${ante}): ${rtp.toFixed(6)}`);
    return rtp;
  }

  window.estimateRTP = estimateRTP;

  // --- UI CONTROLS & EVENT HANDLERS ---
  const gridEl = document.getElementById('grid');
  const balanceVal = document.getElementById('balanceVal');
  const betVal = document.getElementById('betVal');
  const betPlus = document.getElementById('betPlus');
  const betMinus = document.getElementById('betMinus');
  const anteToggle = document.getElementById('anteToggle');
  const buyBonusBtn = document.getElementById('buyBonusBtn');
  const buyBonusPrice = document.getElementById('buyBonusPrice');
  const buySuperBonusBtn = document.getElementById('buySuperBonusBtn');
  const buySuperBonusPrice = document.getElementById('buySuperBonusPrice');
  const spinBtn = document.getElementById('spinBtn');
  const tickerHead = document.getElementById('tickerHead');
  const tickerLines = document.getElementById('tickerLines');
  const fsBanner = document.getElementById('fsBanner');
  const paytable = document.getElementById('paytable');
  const paytableToggle = document.getElementById('paytableToggle');
  const bigwinOverlay = document.getElementById('bigwinOverlay');
  const bigwinTitle = document.getElementById('bigwinTitle');
  const bigwinCounter = document.getElementById('bigwinCounter');
  const bankruptOverlay = document.getElementById('bankruptOverlay');
  const bankruptReset = document.getElementById('bankruptReset');

  function renderGrid(g, winSet = new Set(), scatterSet = new Set(), multGrid = null, stickySet = new Set()) {
    gridEl.innerHTML = '';
    for(let r=0; r<5; r++){
      for(let c=0; c<5; c++){
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.col = c;
        cell.dataset.row = r;

        const k = r+','+c;
        if (winSet.has(k)) cell.classList.add('win');
        if (scatterSet.has(k)) cell.classList.add('scatterwin');
        if (stickySet && stickySet.has(k)) cell.classList.add('sticky-wild');

        const sym = g[r][c];
        cell.innerHTML = imageTags[sym] || '';

        if (multGrid && multGrid.has(k)) {
          const badge = document.createElement('div');
          badge.className = 'wild-mult-badge';
          badge.textContent = 'x' + multGrid.get(k);
          cell.appendChild(badge);
        }
        gridEl.appendChild(cell);
      }
    }
  }

  function updateUI() {
    balanceVal.textContent = fmt(state.balance);
    
    const actualBet = getActualCost();
    betVal.textContent = fmt(actualBet);

    buyBonusPrice.textContent = fmt(getBuyBonusCost());
    buySuperBonusPrice.textContent = fmt(getBuySuperBonusCost());

    const isBusy = state.busy;
    spinBtn.disabled = isBusy || state.balance < actualBet;
    buyBonusBtn.disabled = isBusy || state.balance < getBuyBonusCost();
    buySuperBonusBtn.disabled = isBusy || state.balance < getBuySuperBonusCost();
    betPlus.disabled = isBusy;
    betMinus.disabled = isBusy;
    anteToggle.disabled = isBusy;
  }

  function setTicker(headline, lines = [], isZero = false) {
    tickerHead.textContent = headline;
    tickerHead.className = 'headline' + (isZero ? ' zero' : '');
    tickerLines.innerHTML = lines.map(l => `<div>${l}</div>`).join('');
  }

  function animateWinCells(winSet) {
    try {
      if (!winSet || winSet.size === 0) return;
      const cells = Array.from(gridEl.querySelectorAll('.cell.win'));
      cells.sort((a,b) => (parseInt(a.dataset.col) - parseInt(b.dataset.col)) || (parseInt(a.dataset.row) - parseInt(b.dataset.row)));
      cells.forEach((cell, i) => {
        setTimeout(() => {
          cell.classList.add('win-anim');
          const sweep = document.createElement('div');
          sweep.className = 'sweep';
          sweep.style.animation = `sweep ${600 + (i%5)*90}ms cubic-bezier(.2,.9,.2,1) forwards`;
          cell.appendChild(sweep);
          setTimeout(() => {
            cell.classList.remove('win-anim');
            if (sweep && sweep.parentNode) sweep.parentNode.removeChild(sweep);
          }, 1200);
        }, i * 100);
      });
    } catch (e) { console.warn('animateWinCells err', e); }
  }

  function buildPaytable() {
    let html = '<h3>TABELA WYPŁAT (STAWKA BAZOWA: 1.00)</h3>';
    Object.keys(SYMBOLS).forEach(s => {
      const p = SYMBOLS[s].payout;
      html += `<div class="pt-row">
        <div class="pt-sym">${imageTags[s]}</div>
        <div>3x: ${p[3]}x &nbsp;|&nbsp; 4x: ${p[4]}x &nbsp;|&nbsp; 5x: ${p[5]}x</div>
      </div>`;
    });
    paytable.innerHTML = html;
  }
  buildPaytable();

  paytableToggle.addEventListener('click', () => paytable.classList.toggle('open'));
  anteToggle.addEventListener('change', (e) => { state.anteActive = e.target.checked; updateUI(); });

  betPlus.addEventListener('click', () => {
    let idx = BET_PRESETS.indexOf(state.baseBet);
    if (idx < BET_PRESETS.length - 1) { state.baseBet = BET_PRESETS[idx + 1]; updateUI(); }
  });
  betMinus.addEventListener('click', () => {
    let idx = BET_PRESETS.indexOf(state.baseBet);
    if (idx > 0) { state.baseBet = BET_PRESETS[idx - 1]; updateUI(); }
  });

  function showBigWin(amount, callback) {
    playSound('coin');
    
    const mult = amount / getActualCost();
    if (mult >= 30) {
      bigwinTitle.textContent = "EPIC PUNK WIN!";
    } else if (mult >= 15) {
      bigwinTitle.textContent = "BIG WIN!";
    } else {
      bigwinTitle.textContent = "GREAT WIN!";
    }

    bigwinOverlay.classList.add('open');
    let current = 0;
    const step = amount / 30;
    const timer = setInterval(() => {
      current += step;
      if (current >= amount) {
        current = amount;
        clearInterval(timer);
      }
      bigwinCounter.textContent = fmt(current);
    }, 30);

    const closeHandler = () => {
      bigwinOverlay.classList.remove('open');
      bigwinOverlay.removeEventListener('click', closeHandler);
      clearInterval(timer);
      if (callback) callback();
    };
    bigwinOverlay.addEventListener('click', closeHandler);
  }

  async function animateReelsLeftToRight(targetGrid, multGrid = null, stickySet = new Set()) {
    playSound('spin');
    skipSpinRequested = false;

    const allCells = gridEl.querySelectorAll('.cell');
    allCells.forEach(c => {
      c.classList.remove('stopped', 'win', 'scatterwin', 'reel-anticipation');
      c.classList.add('spinning');
    });

    let currentScatters = 0;

    for (let col = 0; col < 5; col++) {
      const isAnticipating = (currentScatters >= 2 && col >= 2);

      if (isAnticipating && !skipSpinRequested) {
        const colCells = gridEl.querySelectorAll(`.cell[data-col="${col}"]`);
        colCells.forEach(c => c.classList.add('reel-anticipation'));
        playAnticipationSound(col - 2);

        // slower anticipation to preserve tension (slightly slower)
        let waitTime = 1400;
        const fastStep = 60; // fast cycling for non-anticipation reels
        const slowStep = 140; // slow cycle for anticipation column
        let iter = 0;
        while (waitTime > 0 && !skipSpinRequested) {
          // update other still-spinning reels faster to imitate spinning
          const otherSpinning = gridEl.querySelectorAll('.cell.spinning:not(.reel-anticipation)');
          otherSpinning.forEach(cell => {
            cell.innerHTML = imageTags[randomSpinSymbol()];
          });

          // update anticipation column less frequently for tension
          if (iter % Math.ceil(slowStep / fastStep) === 0) {
            colCells.forEach(cell => {
              cell.innerHTML = imageTags[randomSpinSymbol()];
            });
          }

          await new Promise(res => setTimeout(res, fastStep));
          waitTime -= fastStep;
          iter++;
        }
      } else if (!skipSpinRequested) {
        // while waiting for this column to stop, update all still-spinning reels (slightly slower)
        let waitTime = 180; // total period to show fast cycling
        const step = 28;
        while (waitTime > 0 && !skipSpinRequested) {
          const spinningCells = gridEl.querySelectorAll('.cell.spinning');
          spinningCells.forEach(cell => {
            const row = parseInt(cell.dataset.row);
            cell.innerHTML = imageTags[randomSpinSymbol()];
          });
          await new Promise(res => setTimeout(res, step));
          waitTime -= step;
        }
      }

      const colCells = gridEl.querySelectorAll(`.cell[data-col="${col}"]`);

      if (isAnticipating && !skipSpinRequested) {
        // decelerate only the anticipation column while keeping other reels spinning at a steady pace (slower)
        let decelTotal = 420 + col * 220; // later columns slow longer
        const minInterval = 26;
        const maxInterval = 300;
        const startTime = (typeof performance !== 'undefined') ? performance.now() : Date.now();
        const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
        const otherSpinInterval = setInterval(() => {
          const others = gridEl.querySelectorAll('.cell.spinning:not(.reel-anticipation)');
          others.forEach(cell => { cell.innerHTML = imageTags[randomSpinSymbol()]; });
        }, 40);

        try {
          while (!skipSpinRequested) {
            const now = (typeof performance !== 'undefined') ? performance.now() : Date.now();
            const elapsed = now - startTime;
            if (elapsed >= decelTotal) break;
            const t = Math.min(1, Math.max(0, elapsed / decelTotal));
            const eased = easeOutCubic(t);
            const interval = minInterval + (maxInterval - minInterval) * eased;

            const isFinalPass = elapsed >= Math.max(0, decelTotal - interval * 1.5);
            if (isFinalPass) {
              // last frame during anticipation should show the actual hit symbols
              colCells.forEach(cell => {
                const row = parseInt(cell.dataset.row);
                const sym = targetGrid[row][col];
                cell.innerHTML = imageTags[sym] || '';
              });
            } else {
              colCells.forEach(cell => { cell.innerHTML = imageTags[randomSpinSymbol()]; });
            }

            await new Promise(res => setTimeout(res, Math.max(6, Math.round(interval))));
          }
        } finally {
          clearInterval(otherSpinInterval);
        }

        // show final hit frame before finishing
        colCells.forEach(cell => {
          const row = parseInt(cell.dataset.row);
          const sym = targetGrid[row][col];
          cell.innerHTML = imageTags[sym] || '';
        });

        // finalize symbols for this column
        colCells.forEach(cell => {
          const row = parseInt(cell.dataset.row);
          const sym = targetGrid[row][col];
          const k = row + ',' + col;

          cell.classList.remove('spinning', 'reel-anticipation');
          cell.classList.add('stopped');
          cell.innerHTML = imageTags[sym] || '';

          if (sym === SCATTER) currentScatters++;

          if (multGrid && multGrid.has(k)) {
            const badge = document.createElement('div');
            badge.className = 'wild-mult-badge';
            badge.textContent = 'x' + multGrid.get(k);
            cell.appendChild(badge);
          }

          if (stickySet && stickySet.has(k)) {
            cell.classList.add('sticky-wild');
          }
        });

        // quieter per-reel stop during anticipation
        playSound('reelStop');
      } else {
        // quick finalize for normal (non-anticipation) reels
        colCells.forEach(cell => {
          const row = parseInt(cell.dataset.row);
          const sym = targetGrid[row][col];
          const k = row + ',' + col;

          cell.classList.remove('spinning', 'reel-anticipation');
          cell.classList.add('stopped');
          cell.innerHTML = imageTags[sym] || '';

          if (sym === SCATTER) currentScatters++;

          if (multGrid && multGrid.has(k)) {
            const badge = document.createElement('div');
            badge.className = 'wild-mult-badge';
            badge.textContent = 'x' + multGrid.get(k);
            cell.appendChild(badge);
          }

          if (stickySet && stickySet.has(k)) {
            cell.classList.add('sticky-wild');
          }
        });

        // original punchy stop for normal reels
        playSound('stop');
      }
    }
  }

  // --- CORE GAME LOOP ---
  async function runFreeSpins(initialFsCount, isSuper = false, showInitial = false) {
    // If this is the first time the bonus is awarded, show a prominent "10 FREE SPINS" splash
    if (showInitial) {
      fsBanner.classList.add('on', 'initial');
      fsBanner.textContent = `${initialFsCount} FREE SPINS!`;
      playSound('bonus');
      await new Promise(r => setTimeout(r, 1400));
      fsBanner.classList.remove('initial');
    }

    fsBanner.classList.add('on');
    fsBanner.textContent = isSuper ? "SUPER ANARCHY SPINS · STICKY WILDS x2-x5" : "ANARCHY SPINS · WILD MULTIPLIER x2-x5";
    // switch to bonus/super music
    playBonusMusic(isSuper);

    let fsLeft = initialFsCount;
    let totalFsWin = 0;
    const stickyWildsMap = new Map();
    const stickySet = new Set();

    while (fsLeft > 0) {
      fsLeft--;
      setTicker(`DARMOWY SPIN (POZOSTAŁO: ${fsLeft})`, [`Łączna wygrana bonusu: ${fmt(totalFsWin)}`]);

      const g = spinReels(isSuper);
      const multGrid = new Map();

      if (isSuper) {
        stickyWildsMap.forEach((mult, key) => {
          const [r, c] = key.split(',').map(Number);
          g[r][c] = WILD;
          multGrid.set(key, mult);
        });
      }

      for (let r=0; r<5; r++) {
        for (let c=0; c<5; c++) {
          const k = r+','+c;
          if (g[r][c] === WILD && !multGrid.has(k)) {
            const m = rollWildMultiplier();
            multGrid.set(k, m);
            if (isSuper) {
              stickyWildsMap.set(k, m);
              stickySet.add(k);
            }
          }
        }
      }

      await animateReelsLeftToRight(g, multGrid, stickySet);

      const res = evaluateSpin(g, state.baseBet, true, multGrid);
      totalFsWin += res.totalWin;

      if (res.freeSpinsWon > 0) fsLeft += res.freeSpinsWon;

      renderGrid(g, res.winCells, new Set(res.scatterCells), multGrid, stickySet);
      animateWinCells(res.winCells);
      if (res.totalWin > 0) playSound('win');

      await new Promise(res => setTimeout(res, 1000));
    }

    // stop bonus music and resume bg
    stopBonusMusic();
    fsBanner.classList.remove('on');
    state.balance += totalFsWin;
    updateUI();

    if (totalFsWin >= getActualCost() * 5) {
      await new Promise(res => showBigWin(totalFsWin, res));
    } else {
      setTicker("KONIEC BONUSU!", [`Suma wygranych z Free Spinów: ${fmt(totalFsWin)}`]);
    }
  }

  async function executeSpin(type = 'normal') {
    if (state.busy) {
      skipSpinRequested = true;
      return;
    }

    handleBgMusic();

    state.busy = true;

    let cost = getActualCost();
    if (type === 'buy') cost = getBuyBonusCost();
    if (type === 'super') cost = getBuySuperBonusCost();

    if (state.balance < cost) {
      state.busy = false;
      updateUI();
      return;
    }

    state.balance -= cost;
    spinBtn.disabled = false;
    updateUI();

    setTicker("KRĘCENIE BĘBNAMI...", []);

    let g;
    if (type === 'buy') g = spinReelsForBuyBonus();
    else if (type === 'super') g = spinReelsForBuySuperBonus();
    else g = spinReels();

    await animateReelsLeftToRight(g);

    await new Promise(res => setTimeout(res, 30));

    const res = evaluateSpin(g, state.baseBet, false);
    renderGrid(g, res.winCells, new Set(res.scatterCells));
    animateWinCells(res.winCells);

    if (res.totalWin > 0) {
      state.balance += res.totalWin;
      playSound('win');
      setTicker(`WYGRANA: ${fmt(res.totalWin)}`, res.details.map(d => d.text));

      if (res.totalWin >= cost * 5) {
        await new Promise(r => showBigWin(res.totalWin, r));
      }
    } else {
      setTicker("BRAK WYGRANEJ", [], true);
    }

    updateUI();

    if (res.freeSpinsWon > 0 || type === 'buy' || type === 'super') {
      const isSuper = type === 'super' || res.scatterCount >= 5;
      const spins = res.freeSpinsWon > 0 ? res.freeSpinsWon : 10;
      await new Promise(res => setTimeout(res, 800));
      // showInitial = true when the free-spins are being started from a normal/buy/super spin
      await runFreeSpins(spins, isSuper, true);
    }

    if (state.balance <= 0) bankruptOverlay.classList.add('open');

    state.busy = false;
    updateUI();
  }

  spinBtn.addEventListener('click', () => executeSpin('normal'));
  buyBonusBtn.addEventListener('click', () => executeSpin('buy'));
  buySuperBonusBtn.addEventListener('click', () => executeSpin('super'));

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      executeSpin('normal');
    }
  });

  bankruptReset.addEventListener('click', () => {
    state.balance = 1000;
    bankruptOverlay.classList.remove('open');
    updateUI();
    setTicker("ZRESETOWANO SALDO DEMO. POWODZENIA!", []);
  });

  // Start init
  const initialGrid = Array.from({length: 5}, () => Array(5).fill('anarchy'));
  renderGrid(initialGrid);
  updateUI();
  // Ensure audio elements reflect initial slider value immediately
  try {
    if (typeof volumeSlider !== 'undefined' && volumeSlider) volumeSlider.value = String(currentVolume);
  } catch (e) {}
  if (typeof updateVolumes === 'function') updateVolumes();

})();
</script>
